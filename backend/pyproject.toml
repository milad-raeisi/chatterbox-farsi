[project]
name = "ava-backend"
version = "0.1.0"
description = "Offline Persian TTS server for the Ava studio (Chatterbox Farsi)"
requires-python = ">=3.10,<3.13"
dependencies = [
  "chatterbox-tts==0.1.7",
  # resemble-perth's watermarker imports pkg_resources (removed in setuptools 81)
  "setuptools<81",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "soundfile>=0.12",
  "huggingface_hub",
  "numpy",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
